plugins {
    id 'java'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
    id 'maven-publish'
}

archivesBaseName = "${mod_id}-common-${minecraft_version}"

minecraft {
    version(minecraft_version)
    runs {
        if (project.hasProperty('common_runs_enabled') ? project.findProperty('common_runs_enabled').toBoolean() : true) {

            server(project.hasProperty('common_server_run_name') ? project.findProperty('common_server_run_name') : 'vanilla_server') {
                workingDirectory(this.file("run"))
            }
            client(project.hasProperty('common_client_run_name') ? project.findProperty('common_client_run_name') : 'vanilla_client') {
                workingDirectory(this.file("run"))
            }
        }
    }
    if (project.hasProperty('common_aws_enabled') && project.findProperty('common_aws_enabled').toBoolean()) {
        accessWideners(project(":Common").file("src/main/resources/nyfsspiders.accesswidener"))
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation("com.github.llamalad7.mixinextras:mixinextras-common:0.2.0-rc.3")
    annotationProcessor("com.github.llamalad7.mixinextras:mixinextras-common:0.2.0-rc.3")

    implementation 'com.nyfaria.nyfsspiders.registration:regutils:1.20.1-1.0.1'
    implementation 'org.spongepowered:mixin:0.8.5'
    implementation 'com.google.code.findbugs:jsr305:3.0.1'
    implementation 'com.github.llamalad7.mixinextras:mixinextras-common:0.2.0-rc.3'
    implementation "net.minecraftforge:forge:1.20.1-47.0.3"
}
sourceSets.main.resources.srcDir './src/generated/resources'
processResources {

    def buildProps = project.properties.clone()

    filesMatching(['pack.mcmeta']) {

        expand buildProps
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
            mavenCentral() // For jsr305
            //maven { url 'https://maven.minecraftforge.net' } // For Forge
            maven { url 'https://repo.spongepowered.org/repository/maven-public/' } // For Mixin
            maven { url 'https://jitpack.io' } // For mixinextras
            maven { url 'https://maven.nyfaria.com/releases' }
            maven { url 'https://jitpack.io' }
            //maven { url = 'https://maven.parchmentmc.org' }
            maven { url = 'https://maven.fabricmc.net/' }
        }
    }
}
